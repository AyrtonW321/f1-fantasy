[project]
name = "f1-fantasy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pandas",
    "pyarrow",
    "numpy",
    "pyyaml",
    "pulp>=3.3.2,<4",
    "fastf1>=3.9.2",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = ["ignore:.*PuLP 4.0.*:DeprecationWarning"]
markers = [
    "data: needs real data in data/raw",
]
